<svg xmlns="http://www.w3.org/2000/svg" width="86.603" height="150" viewBox="0 0 86.603 150">
  <defs>
    <style>
      .hex-edge {
        stroke: #8ec9f5;
        stroke-width: 1.25;
        stroke-opacity: 0.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hex-vertex {
        fill: #8ec9f5;
        fill-opacity: 0.55;
      }
    </style>
  </defs>
  <!-- Hexagon edges forming seamless repeating grid -->
  <g class="hex-edge" fill="none">
    <path d="M 0 50 L 43.301 25 L 86.603 50 L 86.603 100 L 43.301 125 L 0 100 Z" />
    <line x1="43.301" y1="25" x2="43.301" y2="0" />
    <line x1="43.301" y1="125" x2="43.301" y2="150" />
  </g>
  <!-- Small node circles at vertices -->
  <g class="hex-vertex">
    <circle cx="43.301" cy="25" r="2.5" />
    <circle cx="43.301" cy="125" r="2.5" />
    <circle cx="0" cy="50" r="2.5" />
    <circle cx="86.603" cy="50" r="2.5" />
    <circle cx="0" cy="100" r="2.5" />
    <circle cx="86.603" cy="100" r="2.5" />
  </g>
</svg>
